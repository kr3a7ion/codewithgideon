name: Web CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build web + functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (web)
        run: npm ci
      - name: Type check + build (web)
        run: npm run build
      - name: Install (functions)
        run: npm ci
        working-directory: functions
      - name: Lint (functions)
        run: npm run lint
        working-directory: functions
      - name: Unit tests (functions)
        run: npm test
        working-directory: functions

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      # Failing test names are also posted as annotations on the Checks tab.
      - name: Run rules tests in the emulator
        run: |
          set +e
          npx --yes firebase-tools@latest emulators:exec --only firestore \
            --project demo-cwg-rules \
            "node --test --test-reporter=tap tests/*.test.mjs" > rules.tap 2>&1
          code=$?
          cat rules.tap
          grep -E '^# (tests|pass|fail)' rules.tap || true
          if [ "$code" -ne 0 ]; then
            failed=$(grep -E '^\s*not ok' rules.tap | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=rules tests::${failed:-emulator failed to start (see log)}"
          fi
          exit $code
