      content="Learn Flutter app development, Web development and AI-assisted coding with CodeWithGideon. Practical coding classes for beginners and developers in Nigeria."
    />

    <!-- Theme preload (avoids a light flash for dark-mode users) -->
    <script>
      try {
        const theme =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- App entry -->
    <script type="module" src="/index.tsx"></script>
  </head>

  <body
    class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300"
